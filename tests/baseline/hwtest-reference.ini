[hwtest]
export-version = 1
interactive = no

[framebuffer]
; /sys/class/graphics/fb0
msmdrmfb = True

[drm]
; /sys/class/drm/card0-dsi-1
- = True

[camera]
; /dev/v4l-subdev16
imx363 0-001a = True

[proximity]
; hwtest enumerates the SSC proximity device but has no working probe for it:
; it reports "broken None" and its own --export writes this section empty.
; Recorded as False so it stops reading as newly added hardware on every run.
;
; This is not "the sensor is broken" - it is "hwtest cannot judge this one".
; What the sensor does is checked by 25-sensor, which reads both of its
; channels rather than merely enumerating the device.
; /sys/bus/iio/devices/iio:device4
qcom-smgr-prox-light = False

[vibrator]
; /dev/input/event1
pm8xxx_vib_ffmemless = True

[input]
; /dev/input/event5
fairphone 3 headset jack = True
; /dev/input/event4
himax touchscreen = True
; /dev/input/event3
pm8941_resin = True
; /dev/input/event2
pm8941_pwrkey = True
; /dev/input/event0
gpio-keys = True

