[hwtest]
export-version = 1
interactive = no

[framebuffer]
; /sys/class/graphics/fb0
msmdrmfb = True

[drm]
; /sys/class/drm/card0-dsi-1
- = True

[camera]
; /dev/v4l-subdev16
imx363 0-001a = True

[vibrator]
; /dev/input/event1
pm8xxx_vib_ffmemless = True

[input]
; /dev/input/event5
fairphone 3 headset jack = True
; /dev/input/event4
himax touchscreen = True
; /dev/input/event3
pm8941_resin = True
; /dev/input/event2
pm8941_pwrkey = True
; /dev/input/event0
gpio-keys = True

