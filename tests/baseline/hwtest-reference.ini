[hwtest]
export-version = 1
interactive = no
skipped = Camera,Vibrator,Audio

[framebuffer]
; /sys/class/graphics/fb0
msmdrmfb = True

[drm]
; /sys/class/drm/card0-dsi-1
- = True

[input]
; /dev/input/event6
fairphone 3 headset jack = True
; /dev/input/event5
; /dev/input/event4
himax touchscreen = True
; /dev/input/event2
pm8941_resin = True
; /dev/input/event1
pm8941_pwrkey = True
; /dev/input/event0
gpio-keys = True

