# Voice call configuration for Fairphone 3 (mainline msm8953 + WCD9335)
#
# The modem voice runs as a QDSP6 VoiceMMode1 session bridged to the codec over
# SLIMbus. The AP side is: route the voice downlink onto a codec output and the
# voice uplink off a codec (or QUIN) input, then run the VoiceMMode1 PCM so the
# ADSP instantiates the voice topology. callaudiod switches the output device
# (Earpiece <-> Speaker) and the input follows the plugged jack.
#
# Downlink:
#   Earpiece / Headphones - SLIMBUS_0_RX Voice Mixer -> codec EAR / HPH
#   Speaker (speakerphone) - QUIN_MI2S_RX Voice Mixer -> AW8898
# Uplink:
#   Mic / Headset - codec DEC0 -> SLIMBUS_0_TX -> VoiceMMode1 Capture Mixer
#
# The codec RX/TX routing itself is identical to HiFi; only the ADSP front-end
# mixer differs (Voice Mixer instead of Audio Mixer).
#
# What pulseaudio sees
# --------------------
# The voice PCM (hw:x,4) is a control-only front end: it carries no data, no copy
# op, no hardware pointer, so pulseaudio cannot drive it as a sink or source - it
# is opened and started by q6voiced instead. Pulseaudio still needs *some*
# openable PCM per device or it drops the whole profile at probe time, so the
# output devices below advertise the ALSA "null" PCM:
#
#   * so each output device advertises the ordinary media PCM (device 0) and
#     keeps the matching media mixer routed, which makes the profile probe-able.
#     A media stream and the voice path can share the SLIMBUS_0_RX backend -
#     verified with a media aplay running alongside a held voice session, no
#     error. (An ADSP_EALREADY on that backend means a stale half-configured
#     session, not a real conflict: reset the verb to HiFi.)
#   * pulseaudio's own stream is silent during a call; what matters is that
#     PlaybackVolume points at the codec gain that really sits in the voice path,
#     so the volume keys scale the call itself.
#
# The capture devices deliberately have no CapturePCM: pulseaudio's UCM wrapper
# cannot run hw_params on PCM device 1 of this card, and a profile carrying a
# broken source is dropped, taking the verb with it. The uplink is routed by the
# sequences below; pulseaudio reaches the microphone through the separate
# module-alsa-source (fp3-handset-mic), exactly as in HiFi.

SectionVerb {

	EnableSequence [
		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIM RX1 MUX' ZERO"
		cset "name='RX INT0_2 MUX' ZERO"
		cset "name='RX INT1_2 MUX' ZERO"
		cset "name='RX INT2_2 MUX' ZERO"
		# NB: the capture chain (ADC/AMIC/DMIC MUX, SLIM TX0 MUX) is
		# deliberately NOT reset here. Pulseaudio reaches the microphone
		# through a standalone module-alsa-source that is not part of any
		# verb, so nothing would restore that path afterwards: the mic
		# would record exact zeros until fp3-mic-select ran again, and
		# every capture hw_params would fail with "Invalid decimator".
	]

	DisableSequence [
	]

	Value {
		TQ "Voice"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece voice downlink"

	ConflictingDevice [
		"Speaker"
		"Headphones"
	]

	EnableSequence [
		# see the Speaker device: the other output's DisableSequence never runs
		cset "name='QUIN_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='RX1 Mix Digital Volume' 0"
		cset "name='RX2 Mix Digital Volume' 0"
		cset "name='RX INT1_2 MUX' ZERO"
		cset "name='RX INT2_2 MUX' ZERO"
		cset "name='SLIMBUS_0_RX Voice Mixer VoiceMMode1' 1"
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 1"
		cset "name='SLIM RX0 MUX' AIF1_PB"
		cset "name='RX INT0_2 MUX' RX0"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX0 Mix Digital Volume' 68"
		cset "name='EAR PA Volume' 0"
	]

	DisableSequence [
		cset "name='RX0 Mix Digital Volume' 0"
		cset "name='RX INT0_2 MUX' ZERO"
		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIMBUS_0_RX Voice Mixer VoiceMMode1' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackPriority 30
		PlaybackVolume "name='RX0 Mix Digital Volume'"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker voice downlink (speakerphone)"

	ConflictingDevice [
		"Earpiece"
		"Headphones"
	]

	EnableSequence [
		# Drop the SLIMbus downlink explicitly. Each alsaucm run is a fresh
		# process with no memory of the device that was enabled before, so the
		# other output's DisableSequence never runs: without these the voice
		# frontend keeps both backends ("Quinary MI2S" and "SLIM Playback" in
		# the DPCM state) and hw_params fails with -22.
		cset "name='SLIMBUS_0_RX Voice Mixer VoiceMMode1' 0"
		cset "name='RX0 Mix Digital Volume' 0"
		cset "name='RX1 Mix Digital Volume' 0"
		cset "name='RX2 Mix Digital Volume' 0"
		cset "name='RX INT0_2 MUX' ZERO"
		cset "name='RX INT1_2 MUX' ZERO"
		cset "name='RX INT2_2 MUX' ZERO"
		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIM RX1 MUX' ZERO"
		cset "name='QUIN_MI2S_RX Voice Mixer VoiceMMode1' 1"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 0"
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='QUIN_MI2S_RX Voice Mixer VoiceMMode1' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackPriority 20
	}
}

SectionDevice."Headphones" {
	Comment "Headphones voice downlink"

	ConflictingDevice [
		"Earpiece"
		"Speaker"
	]

	EnableSequence [
		# see the Speaker device: the other output's DisableSequence never runs
		cset "name='QUIN_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='RX0 Mix Digital Volume' 0"
		cset "name='RX INT0_2 MUX' ZERO"
		cset "name='SLIMBUS_0_RX Voice Mixer VoiceMMode1' 1"
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 1"
		cset "name='SLIM RX0 MUX' AIF1_PB"
		cset "name='SLIM RX1 MUX' AIF1_PB"
		cset "name='RX INT1_2 MUX' RX0"
		cset "name='RX INT2_2 MUX' RX1"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT2 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX1 Mix Digital Volume' 68"
		cset "name='RX2 Mix Digital Volume' 68"
		cset "name='HPHL Volume' 20"
		cset "name='HPHR Volume' 20"
	]

	DisableSequence [
		cset "name='RX1 Mix Digital Volume' 0"
		cset "name='RX2 Mix Digital Volume' 0"
		cset "name='RX INT1_2 MUX' ZERO"
		cset "name='RX INT2_2 MUX' ZERO"
		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIM RX1 MUX' ZERO"
		cset "name='SLIMBUS_0_RX Voice Mixer VoiceMMode1' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackPriority 10
		JackControl "Headset Jack"
		# "Headphone Jack" and "Mic Jack" are pins of the machine
		# driver's jack and nothing ever reports into them on this
		# board; the codec's MBHC drives "Headset Jack" alone. With
		# the wrong control pulseaudio marks the headphone profile
		# unavailable, refuses to select it, and ends up with no sink
		# at all when something asks for it.
		# No PlaybackVolume: the headphone downlink is stereo and the codec
		# exposes RX1/RX2 as two separate mono gains, which UCM cannot address
		# as one element. In-call volume on the headset therefore stays at the
		# level set above until a combined control exists (ctl-remap).
	}
}

SectionDevice."Mic" {
	Comment "Built-in handset microphone (voice uplink)"

	ConflictingDevice [
		"Headset"
	]

	EnableSequence [
		cset "name='VoiceMMode1 Capture Mixer SLIMBUS_0_TX' 1"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
		cset "name='AIF1_CAP Mixer SLIM TX0' 1"
		cset "name='SLIM TX0 MUX' DEC0"
		cset "name='ADC MUX0' DMIC"
		cset "name='DMIC MUX0' DMIC0"
	]

	DisableSequence [
		# Only the voice mixer is ours to undo - the codec TX chain is
		# shared with media capture, see the note in SectionVerb.
		cset "name='VoiceMMode1 Capture Mixer SLIMBUS_0_TX' 0"
	]

	Value {
		# No CapturePCM on purpose: pulseaudio's UCM wrapper cannot run
		# hw_params on PCM device 1 of this card (_ucm0001.hw:F3,1 ->
		# -EINVAL), so any profile carrying a source is dropped at probe
		# time and the whole verb disappears. The uplink is routed by the
		# sequences above; pulseaudio reaches the microphone through the
		# separate module-alsa-source (fp3-handset-mic), as in HiFi.
		CapturePriority 20
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone (voice uplink)"

	ConflictingDevice [
		"Mic"
	]

	EnableSequence [
		cset "name='VoiceMMode1 Capture Mixer SLIMBUS_0_TX' 1"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
		cset "name='AIF1_CAP Mixer SLIM TX0' 1"
		cset "name='SLIM TX0 MUX' DEC0"
		cset "name='ADC MUX0' AMIC"
		cset "name='AMIC MUX0' ADC2"
		cset "name='ADC2 Volume' 20"
	]

	DisableSequence [
		# Hand the codec TX chain back to the built-in microphone rather
		# than zeroing it, see the note in SectionVerb.
		cset "name='AMIC MUX0' ZERO"
		cset "name='ADC MUX0' DMIC"
		cset "name='DMIC MUX0' DMIC0"
		cset "name='VoiceMMode1 Capture Mixer SLIMBUS_0_TX' 0"
	]

	Value {
		# See the note in the Mic device: no CapturePCM here either.
		CapturePriority 10
		JackControl "Headset Jack"
		# "Headphone Jack" and "Mic Jack" are pins of the machine
		# driver's jack and nothing ever reports into them on this
		# board; the codec's MBHC drives "Headset Jack" alone. With
		# the wrong control pulseaudio marks the headphone profile
		# unavailable, refuses to select it, and ends up with no sink
		# at all when something asks for it.
	}
}
