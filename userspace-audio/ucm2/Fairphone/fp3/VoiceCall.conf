# Voice call configuration for Fairphone 3 (mainline msm8953 + WCD9335)
#
# The modem voice runs as a QDSP6 VoiceMMode1 session bridged to the codec over
# SLIMbus. The AP side is: route the voice downlink onto a codec output and the
# voice uplink off a codec (or QUIN) input, then run the VoiceMMode1 PCM so the
# ADSP instantiates the voice topology. callaudiod switches the output device
# (Earpiece <-> Speaker) and the input follows the plugged jack.
#
# Downlink:
#   Earpiece / Headphones - SLIMBUS_0_RX Voice Mixer -> codec EAR / HPH
#   Speaker (speakerphone) - QUIN_MI2S_RX Voice Mixer -> AW8898
# Uplink:
#   Mic / Headset - codec DEC0 -> SLIMBUS_0_TX -> VoiceMMode1 Capture Mixer
#
# The codec RX/TX routing itself is identical to HiFi; only the ADSP front-end
# mixer differs (Voice Mixer instead of Audio Mixer).

SectionVerb {

	EnableSequence [
		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIM RX1 MUX' ZERO"
		cset "name='RX INT0_2 MUX' ZERO"
		cset "name='RX INT1_2 MUX' ZERO"
		cset "name='RX INT2_2 MUX' ZERO"
		cset "name='ADC MUX0' ZERO"
		cset "name='AMIC MUX0' ZERO"
		cset "name='DMIC MUX0' ZERO"
		cset "name='SLIM TX0 MUX' ZERO"
	]

	DisableSequence [
	]

	Value {
		TQ "Voice"
		PlaybackPCM "hw:${CardId},4"
		CapturePCM "hw:${CardId},4"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece voice downlink"

	ConflictingDevice [
		"Speaker"
		"Headphones"
	]

	EnableSequence [
		cset "name='SLIMBUS_0_RX Voice Mixer VoiceMMode1' 1"
		cset "name='SLIM RX0 MUX' AIF1_PB"
		cset "name='RX INT0_2 MUX' RX0"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX0 Mix Digital Volume' 68"
		cset "name='EAR PA Volume' 0"
	]

	DisableSequence [
		cset "name='RX0 Mix Digital Volume' 0"
		cset "name='RX INT0_2 MUX' ZERO"
		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIMBUS_0_RX Voice Mixer VoiceMMode1' 0"
	]

	Value {
		PlaybackPriority 300
	}
}

SectionDevice."Speaker" {
	Comment "Speaker voice downlink (speakerphone)"

	ConflictingDevice [
		"Earpiece"
		"Headphones"
	]

	EnableSequence [
		cset "name='QUIN_MI2S_RX Voice Mixer VoiceMMode1' 1"
	]

	DisableSequence [
		cset "name='QUIN_MI2S_RX Voice Mixer VoiceMMode1' 0"
	]

	Value {
		PlaybackPriority 200
	}
}

SectionDevice."Headphones" {
	Comment "Headphones voice downlink"

	ConflictingDevice [
		"Earpiece"
		"Speaker"
	]

	EnableSequence [
		cset "name='SLIMBUS_0_RX Voice Mixer VoiceMMode1' 1"
		cset "name='SLIM RX0 MUX' AIF1_PB"
		cset "name='SLIM RX1 MUX' AIF1_PB"
		cset "name='RX INT1_2 MUX' RX0"
		cset "name='RX INT2_2 MUX' RX1"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT2 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX1 Mix Digital Volume' 68"
		cset "name='RX2 Mix Digital Volume' 68"
		cset "name='HPHL Volume' 20"
		cset "name='HPHR Volume' 20"
	]

	DisableSequence [
		cset "name='RX1 Mix Digital Volume' 0"
		cset "name='RX2 Mix Digital Volume' 0"
		cset "name='RX INT1_2 MUX' ZERO"
		cset "name='RX INT2_2 MUX' ZERO"
		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIM RX1 MUX' ZERO"
		cset "name='SLIMBUS_0_RX Voice Mixer VoiceMMode1' 0"
	]

	Value {
		PlaybackPriority 100
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Built-in handset microphone (voice uplink)"

	ConflictingDevice [
		"Headset"
	]

	EnableSequence [
		cset "name='VoiceMMode1 Capture Mixer SLIMBUS_0_TX' 1"
		cset "name='AIF1_CAP Mixer SLIM TX0' 1"
		cset "name='SLIM TX0 MUX' DEC0"
		cset "name='ADC MUX0' DMIC"
		cset "name='DMIC MUX0' DMIC0"
	]

	DisableSequence [
		cset "name='DMIC MUX0' ZERO"
		cset "name='ADC MUX0' ZERO"
		cset "name='SLIM TX0 MUX' ZERO"
		cset "name='AIF1_CAP Mixer SLIM TX0' 0"
		cset "name='VoiceMMode1 Capture Mixer SLIMBUS_0_TX' 0"
	]

	Value {
		CapturePriority 200
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone (voice uplink)"

	ConflictingDevice [
		"Mic"
	]

	EnableSequence [
		cset "name='VoiceMMode1 Capture Mixer SLIMBUS_0_TX' 1"
		cset "name='AIF1_CAP Mixer SLIM TX0' 1"
		cset "name='SLIM TX0 MUX' DEC0"
		cset "name='ADC MUX0' AMIC"
		cset "name='AMIC MUX0' ADC2"
		cset "name='ADC2 Volume' 20"
	]

	DisableSequence [
		cset "name='ADC2 Volume' 0"
		cset "name='AMIC MUX0' ZERO"
		cset "name='ADC MUX0' ZERO"
		cset "name='SLIM TX0 MUX' ZERO"
		cset "name='AIF1_CAP Mixer SLIM TX0' 0"
		cset "name='VoiceMMode1 Capture Mixer SLIMBUS_0_TX' 0"
	]

	Value {
		CapturePriority 100
		JackControl "Mic Jack"
	}
}
