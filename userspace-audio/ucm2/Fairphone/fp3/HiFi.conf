# FP3 HiFi - all playback multiplexed on MultiMedia1 (PCM device 0), which is
# the only PCM pulseaudio's UCM layer can wrap on this card. The output is
# selected by the ADSP front-end mixer: QUIN_MI2S_RX for the speaker (AW8898),
# SLIMBUS_0_RX for the codec earpiece/headphones.
#
# pulseaudio probes a profile by opening the PCM after running only the verb's
# EnableSequence (not the device's), and a q6asm front-end cannot be opened
# until it is routed to a backend. So the verb must leave MultiMedia1 routed to
# a valid backend (the speaker) - each output device then swaps the backend.
#
# Capture is not a UCM device here: pulseaudio's UCM layer cannot wrap PCM
# device 1 on this card (it only wraps device 0), so a capture SectionDevice
# poisons the whole card. Instead the verb pre-routes the handset digital mic
# (DMIC0 -> DEC0 -> SLIMBUS_0_TX) and the microphone is exposed by loading
# module-alsa-source on hw:${CardId},1 from the pulseaudio config.

SectionVerb {

	EnableSequence [
		# leave MultiMedia1 on the speaker backend so the PCM can be opened
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIM RX1 MUX' ZERO"
		cset "name='RX INT0_2 MUX' ZERO"
		cset "name='RX INT1_2 MUX' ZERO"
		cset "name='RX INT2_2 MUX' ZERO"
		# common capture path; the input source (handset/headset) is
		# owned by fp3-mic-select, not the verb, so it is not reset here
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
		cset "name='AIF1_CAP Mixer SLIM TX0' 1"
		cset "name='SLIM TX0 MUX' DEC0"
	]

	DisableSequence [
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	ConflictingDevice [
		"Earpiece"
		"Headphones"
	]

	EnableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 0"
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackPriority 200
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece playback"

	ConflictingDevice [
		"Speaker"
		"Headphones"
	]

	EnableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 1"
		cset "name='SLIM RX0 MUX' AIF1_PB"
		cset "name='RX INT0_2 MUX' RX0"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX0 Mix Digital Volume' 60"
		cset "name='EAR PA Volume' 0"
	]

	DisableSequence [
		cset "name='RX0 Mix Digital Volume' 0"
		cset "name='RX INT0_2 MUX' ZERO"
		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackPriority 150
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	ConflictingDevice [
		"Speaker"
		"Earpiece"
	]

	EnableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 1"
		cset "name='SLIM RX0 MUX' AIF1_PB"
		cset "name='SLIM RX1 MUX' AIF1_PB"
		cset "name='RX INT1_2 MUX' RX0"
		cset "name='RX INT2_2 MUX' RX1"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT2 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX1 Mix Digital Volume' 48"
		cset "name='RX2 Mix Digital Volume' 48"
		cset "name='HPHL Volume' 20"
		cset "name='HPHR Volume' 20"
	]

	DisableSequence [
		cset "name='RX1 Mix Digital Volume' 0"
		cset "name='RX2 Mix Digital Volume' 0"
		cset "name='RX INT1_2 MUX' ZERO"
		cset "name='RX INT2_2 MUX' ZERO"
		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIM RX1 MUX' ZERO"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackPriority 100
		JackControl "Headset Jack"
		# "Headphone Jack" and "Mic Jack" are pins of the machine
		# driver's jack and nothing ever reports into them on this
		# board; the codec's MBHC drives "Headset Jack" alone. With
		# the wrong control pulseaudio marks the headphone profile
		# unavailable, refuses to select it, and ends up with no sink
		# at all when something asks for it.
	}
}
